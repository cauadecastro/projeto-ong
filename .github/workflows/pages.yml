name: Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Preparar site
        run: |
          mkdir site
          cp html/*.html site/
          cp -r css site/
          cp -r js site/
          cp -r imagens site/
          sed -i 's|\.\./css/|css/|g; s|\.\./js/|js/|g; s|\.\./imagens/|imagens/|g' site/*.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
